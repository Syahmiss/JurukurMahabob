<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JURUKUR MAHABOB TRACKING FILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Design HOD Akaun (Dashboard Jualan & Invois): navy #0A2540 · royal #1D4ED8 · gold #FACC15 · Inter */
:root{
  --navy:#0A2540; --blue:#1E40AF; --royal:#1D4ED8; --light:#EFF6FF; --gold:#FACC15; --amber:#EAB308; --goldDark:#CA8A04;
  --bg:#F8FAFC; --line:#E2E8F0; --line3:#CBD5E1; --soft:#F1F5F9; --ink:#1E293B; --ink2:#475569; --muted:#64748B;
  --ok:#047857; --okBg:#ECFDF5; --warn:#A16207; --warnBg:#FEF9C3; --danger:#DC2626; --dangerBg:#FEE2E2;
  --brand:#1D4ED8; --brand2:#1E40AF; --panel:#fff; --wait:#94A3B8; --hard:#DC2626;
  --f:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:var(--navy)}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line3);border-radius:12px;padding:9px 12px;width:100%;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 2px var(--royal)}
input::placeholder,textarea::placeholder{color:#94A3B8}
.btn{border:1px solid transparent;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn:hover{transform:none}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--blue)}
.btn-soft{background:#fff;border-color:var(--line3);color:var(--navy)}
.btn-soft:hover{background:var(--light);border-color:var(--royal)}
.btn-danger{background:var(--dangerBg);color:#B91C1C}
.btn-danger:hover{background:#FECACA}
/* Header = toolbar navy rounded-2xl (sticky) */
header{background:var(--navy)!important;color:#fff;margin:16px auto 0;max-width:var(--maxw,1200px);width:calc(100% - 32px);border-radius:16px;padding:16px 20px;box-shadow:0 4px 10px -4px rgba(10,37,64,.4);border:0!important}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px;color:#fff}
header p{margin:4px 0 0;font-size:12.5px;color:#BFDBFE;opacity:1}
header .btn-primary{background:var(--gold);color:var(--navy)}
header .btn-primary:hover{background:var(--amber)}
header .btn-ghost{background:rgba(255,255,255,.1);color:#fff}
header .btn-ghost:hover{background:rgba(255,255,255,.2)}
/* Panel / kad */
.panel,.card,.stat,.modal-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
/* KPI = kad putih border-top-4; kad utama navy gradient + bulatan gold */
.stat,.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-top:4px solid var(--royal);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.stat .n,.kpi .n{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .l,.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.stat:nth-child(2),.kpi:nth-child(2){border-top-color:var(--gold)}
.stat:nth-child(3),.kpi:nth-child(3){border-top-color:var(--ok)}
.stat:nth-child(4),.kpi:nth-child(4){border-top-color:#334155}
.jm-hero,.kpi.big{background:linear-gradient(135deg,var(--navy),var(--blue))!important;border:1px solid #1E3A8A!important}
.jm-hero::after,.kpi.big::after{content:"";position:absolute;right:-16px;top:-16px;width:96px;height:96px;border-radius:50%;background:rgba(250,204,21,.12);pointer-events:none}
.jm-hero .n,.kpi.big .n{color:#fff}
.jm-hero .l,.kpi.big .l{color:#BFDBFE}
.pill,.tag{border-radius:999px;font-weight:600}

body{--maxw:1200px}
header{position:sticky;top:12px;z-index:50}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:20px}
.stat:first-child{background:linear-gradient(135deg,var(--navy),var(--blue));border:1px solid #1E3A8A}
.stat:first-child::after{content:"";position:absolute;right:-16px;top:-16px;width:96px;height:96px;border-radius:50%;background:rgba(250,204,21,.12)}
.stat:first-child .n{color:#fff}.stat:first-child .l{color:#BFDBFE}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.filters input{flex:2 1 240px;width:auto;min-width:0}
.filters select{flex:1 1 160px;width:auto;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:20px}
.card{overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#BFDBFE;box-shadow:0 10px 24px -14px rgba(10,37,64,.35)}
.card.open{border-color:#BFDBFE}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.card-head:hover{background:rgba(239,246,255,.6)}
.card-head h3{margin:0;font-size:15px;font-weight:700;color:var(--navy);line-height:1.4;overflow-wrap:anywhere}
.card-head .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:2px 9px;vertical-align:middle}
.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--royal),var(--ok));transition:width .3s}
.card-body{padding:2px 18px 16px;display:none}
.card.open .card-body{display:block}
.stage{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg)}
.stage-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.stage-top .name{font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;min-width:0}
.stage-top select{flex:none;max-width:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.pending{background:var(--wait)}
.dot.progress{background:var(--gold);box-shadow:0 0 0 3px #FEF9C3}
.dot.done{background:var(--ok);box-shadow:0 0 0 3px var(--okBg)}
.stage-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.stage-fields .full{grid-column:1/-1}
.lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:block}
.card-foot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.attach{margin-top:14px}
.attach h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--navy)}
.att-list{display:flex;flex-wrap:wrap;gap:8px}
.att-item{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;background:#fff;display:flex;align-items:center;gap:6px;max-width:100%}
.att-item img{width:36px;height:36px;object-fit:cover;border-radius:6px}
.att-item a{color:var(--royal);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;min-width:0}
.att-x{cursor:pointer;color:var(--danger);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,37,64,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 16px;overflow:auto}
.modal.open{display:flex}
.modal-card{width:100%;max-width:520px;padding:0;overflow:hidden;border-top:4px solid var(--gold)}
.modal-card h2{margin:0;padding:16px 22px;font-size:17px;font-weight:700;color:#fff;background:var(--navy)}
.modal-card>.form-row:first-of-type{margin-top:18px}
.modal-card>.form-row,.modal-card>.form-2,.modal-card>div:last-child{margin-left:22px;margin-right:22px}
.modal-card>div:last-child{margin-bottom:20px}
.modal-card .btn-primary{background:var(--navy)!important}
.modal-card .btn-primary:hover{background:var(--blue)!important}
.form-row{margin-bottom:12px}
.form-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;background:#fff;border:2px dashed var(--line3);border-radius:16px}
.foot-note{text-align:center;color:var(--muted);font-size:11.5px;margin:28px 0 10px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(max-width:640px){
  header{position:static;margin-top:12px;width:calc(100% - 24px);padding:14px 16px}
  header h1{font-size:17px}
  .toolbar .btn,.toolbar label.btn{flex:1 1 calc(50% - 8px)}
  .wrap{padding:14px 12px}
  .stat .n{font-size:23px}
  .stat{padding:14px 16px}
  .filters>*{flex:1 1 100%}
  .stage-fields,.form-2{grid-template-columns:minmax(0,1fr)}
  .stage-top select{width:100%!important}
  .card-foot .btn{flex:1}
}
@media print{header{position:static;box-shadow:none}.toolbar,.filters,.card-foot,.attach label{display:none!important}.card-body{display:block!important}}

/* ============================================================
   JM MOBILE — skrin ≤ 640px: tiada scroll ke tepi.
   Jadual bertukar jadi kad; label lajur diisi oleh skrip jmCards().
   ============================================================ */
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:640px){
  .tbl,.tw,.table-responsive,.tbl-wrap{overflow:visible!important;border:0!important;background:none!important;margin:0!important;border-radius:0!important;max-height:none!important}
  table.jm-cards{min-width:0!important;width:100%!important;border:0!important;background:none!important;border-collapse:separate!important}
  table.jm-cards thead{display:none!important}
  table.jm-cards,table.jm-cards tbody,table.jm-cards tfoot,table.jm-cards tr,table.jm-cards td{display:block!important;width:100%!important;max-width:none!important}
  table.jm-cards tr{position:relative;background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin:0 0 10px;padding:4px 14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  table.jm-cards tbody tr:hover td,table.jm-cards tbody tr:hover{background:#fff!important}
  table.jm-cards td{position:relative;padding:9px 0 9px 40%!important;min-height:36px;border:0!important;border-bottom:1px solid #F1F5F9!important;text-align:left!important;white-space:normal!important;overflow-wrap:anywhere;background:none!important;box-shadow:none!important}
  table.jm-cards td:last-child{border-bottom:0!important}
  table.jm-cards td::before{content:attr(data-label);position:absolute;left:0;top:9px;width:36%;font-size:10.5px;font-weight:600;line-height:1.35;text-transform:uppercase;letter-spacing:.05em;color:#64748B;white-space:normal}
  /* sel pertama = tajuk kad: label di atas, nilai penuh lebar */
  table.jm-cards td:first-child:not(.jm-full){padding:10px 0!important;font-size:14px}
  table.jm-cards td:first-child:not(.jm-full)::before{position:static;display:block;width:auto;margin-bottom:3px}
  /* sel tanpa label (cth. butang padam) */
  table.jm-cards td.jm-nolabel{padding-left:0!important;text-align:right!important}
  table.jm-cards td.jm-nolabel::before{display:none}
  /* baris colspan (kategori, kosong, memuatkan) */
  table.jm-cards td.jm-full{padding:12px 0!important;text-align:center!important;border-bottom:0!important}
  table.jm-cards td.jm-full::before{display:none}
  table.jm-cards tr:has(> td.jm-full:only-child){padding:0 14px}
  table.jm-cards td.category-banner,table.jm-cards .category-banner td{text-align:left!important;padding:10px 14px!important;border-radius:10px;margin:0 -14px;width:calc(100% + 28px)!important}
  table.jm-cards td.category-banner{background:#0A2540!important;color:#fff!important;box-shadow:inset 4px 0 0 #FACC15!important}
  table.jm-cards tr:has(> td.category-banner){background:none;border:0;box-shadow:none;padding:0}
  /* kandungan dalam sel */
  table.jm-cards td .prog,table.jm-cards td .mini{min-width:0;max-width:100%}
  table.jm-cards td input,table.jm-cards td select,table.jm-cards td textarea{width:100%;max-width:100%}
  table.jm-cards td .tick-group{flex-wrap:wrap}
  table.jm-cards td .clip{max-width:100%;white-space:normal}
  img,video,canvas,svg{max-width:100%}
}
</style>
</head>
<body>
<header>
  <h1>📋 JURUKUR MAHABOB TRACKING FILE</h1>
  <p>Track every file from data collection to close — dates, flow, remarks, attachments &amp; photos. Saved in your browser.</p>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">➕ New File</button>
    <button class="btn btn-ghost" onclick="exportData()">⬇️ Backup (JSON)</button>
    <label class="btn btn-ghost" style="margin:0">⬆️ Restore<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>
    <button class="btn btn-ghost" onclick="window.print()">🖨️ Print</button>
  </div>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input id="search" placeholder="🔍 Search client / ref / person..." oninput="render()">
    <select id="fStatus" onchange="render()">
      <option value="">All statuses</option>
      <option value="active">Active (open)</option>
      <option value="closed">Closed</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="created">Sort: Newest</option>
      <option value="client">Sort: Client A–Z</option>
      <option value="progress">Sort: Progress</option>
    </select>
  </div>
  <div id="list" class="grid"></div>
  <div class="foot-note">Data is stored locally in this browser (localStorage). Use Backup regularly to keep a copy.</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="mTitle">New File</h2>
    <div class="form-row"><label class="lbl">File Reference / Job No.</label><input id="fRef" placeholder="e.g. SVY-2026-001"></div>
    <div class="form-row"><label class="lbl">Client</label><input id="fClient" placeholder="Client name"></div>
    <div class="form-row"><label class="lbl">Project / Description</label><textarea id="fDesc" placeholder="Scope of works, location..."></textarea></div>
    <div class="form-2">
      <div class="form-row"><label class="lbl">Start Date</label><input type="date" id="fStart"></div>
      <div class="form-row"><label class="lbl">Target / End Date</label><input type="date" id="fEnd"></div>
    </div>
    <div class="form-row"><label class="lbl">Notes</label><textarea id="fNotes" placeholder="General remarks"></textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
      <button class="btn btn-soft" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="background:#1d4ed8;color:#fff" onclick="saveFile()">Save File</button>
    </div>
  </div>
</div>
<script>
const KEY='survey_tracker_v1';
const STAGES=[
  {k:'collection', label:'1. Data Collection', hint:'Survey team'},
  {k:'processing', label:'2. Processing', hint:'Processed by'},
  {k:'drafting', label:'3. Drafting', hint:'Drafted by'},
  {k:'deliver', label:'4. Deliver Draft to Client', hint:'Delivered by'},
  {k:'finaldraft', label:'5. Final Draft', hint:'Prepared by'},
  {k:'email', label:'6. Final Draft by Email', hint:'Sent by'},
  {k:'postage', label:'7. Postage', hint:'Posted by'},
  {k:'signed', label:'8. Signed by Licensed Surveyor', hint:'Surveyor'},
  {k:'invoice', label:'9. Claim & Invoice', hint:'Accountant'},
  {k:'payment', label:'10. Payment by Client', hint:'Received by'},
  {k:'close', label:'11. Close File', hint:'Closed by'}
];
let data=load();
let editingId=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function uid(){return 'f'+Date.now()+Math.random().toString(36).slice(2,6)}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function newStages(){const o={};STAGES.forEach(s=>o[s.k]={status:'pending',date:'',person:'',remarks:''});return o}

function openModal(id){
  editingId=id||null;
  document.getElementById('mTitle').textContent=id?'Edit File':'New File';
  const f=id?data.find(x=>x.id===id):null;
  fRef.value=f?f.ref:''; fClient.value=f?f.client:''; fDesc.value=f?f.desc:'';
  fStart.value=f?f.start:''; fEnd.value=f?f.end:''; fNotes.value=f?f.notes:'';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}

function saveFile(){
  if(!fClient.value.trim()&&!fRef.value.trim()){alert('Enter at least a Client or File Reference.');return}
  if(editingId){
    const f=data.find(x=>x.id===editingId);
    Object.assign(f,{ref:fRef.value,client:fClient.value,desc:fDesc.value,start:fStart.value,end:fEnd.value,notes:fNotes.value});
  }else{
    data.unshift({id:uid(),ref:fRef.value,client:fClient.value,desc:fDesc.value,start:fStart.value,end:fEnd.value,notes:fNotes.value,created:Date.now(),stages:newStages(),files:[]});
  }
  closeModal();save();
}
function delFile(id){if(confirm('Delete this file permanently?')){data=data.filter(x=>x.id!==id);save()}}
function toggleCard(id){const el=document.getElementById('card-'+id);if(el)el.classList.toggle('open')}

function setStage(id,k,field,val){const f=data.find(x=>x.id===id);f.stages[k][field]=val;localStorage.setItem(KEY,JSON.stringify(data));if(field==='status')render(id)}
function progressOf(f){const done=STAGES.filter(s=>f.stages[s.k].status==='done').length;return Math.round(done/STAGES.length*100)}

// ---- Attachments (files & photos, stored as base64) ----
function addAttach(id,ev){
  const files=[...ev.target.files]; if(!files.length)return;
  const f=data.find(x=>x.id===id);
  let pending=files.length;
  files.forEach(file=>{
    if(file.size>4*1024*1024){alert(file.name+' is larger than 4MB and was skipped (browser storage limit).');if(--pending===0){save();openCard(id)}return}
    const r=new FileReader();
    r.onload=e=>{
      f.files.push({name:file.name,type:file.type,isImg:file.type.startsWith('image/'),data:e.target.result});
      if(--pending===0){save();openCard(id)}
    };
    r.readAsDataURL(file);
  });
  ev.target.value='';
}
function delAttach(id,idx){const f=data.find(x=>x.id===id);f.files.splice(idx,1);save();openCard(id)}
function openCard(id){setTimeout(()=>{const el=document.getElementById('card-'+id);if(el)el.classList.add('open')},0)}

// ---- Backup / Restore ----
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='survey-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(ev){
  const file=ev.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(Array.isArray(d)){if(confirm('Restore will replace current data. Continue?')){data=d;save()}}else alert('Invalid backup file.')}catch(err){alert('Could not read file.')}};
  r.readAsText(file);ev.target.value='';
}

// ---- Render ----
function render(keepOpen){
  const openIds=[...document.querySelectorAll('.card.open')].map(c=>c.id.replace('card-',''));
  if(keepOpen&&!openIds.includes(keepOpen))openIds.push(keepOpen);
  const q=(search.value||'').toLowerCase();
  const fs=fStatus.value, sb=sortBy.value;
  let rows=data.filter(f=>{
    const closed=f.stages.close.status==='done';
    if(fs==='active'&&closed)return false;
    if(fs==='closed'&&!closed)return false;
    const hay=(f.ref+' '+f.client+' '+f.desc+' '+STAGES.map(s=>f.stages[s.k].person).join(' ')).toLowerCase();
    return hay.includes(q);
  });
  if(sb==='client')rows.sort((a,b)=>(a.client||'').localeCompare(b.client||''));
  else if(sb==='progress')rows.sort((a,b)=>progressOf(b)-progressOf(a));
  else rows.sort((a,b)=>b.created-a.created);

  const total=data.length, closed=data.filter(f=>f.stages.close.status==='done').length;
  const avg=data.length?Math.round(data.reduce((s,f)=>s+progressOf(f),0)/data.length):0;
  document.getElementById('stats').innerHTML=
    stat(total,'Total Files')+stat(total-closed,'Active')+stat(closed,'Closed')+stat(avg+'%','Avg Progress');

  const list=document.getElementById('list');
  if(!rows.length){list.innerHTML='<div class="empty" style="grid-column:1/-1">No files yet. Click <b>➕ New File</b> to start tracking.</div>';return}
  list.innerHTML=rows.map(f=>cardHTML(f,openIds.includes(f.id))).join('');
}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}

function cardHTML(f,open){
  const p=progressOf(f);
  const closed=f.stages.close.status==='done';
  const statusTag=closed?'<span class="tag" style="background:#dcfce7;color:#166534">Closed</span>':'<span class="tag" style="background:#dbeafe;color:#1e40af">Active</span>';
  const dur=(f.start||f.end)?('<span>🗓️ '+esc(f.start||'?')+' → '+esc(f.end||'?')+'</span>'):'';
  const stages=STAGES.map(s=>stageHTML(f,s)).join('');
  const atts=(f.files||[]).map((a,i)=>attHTML(f.id,a,i)).join('')||'<span style="font-size:12px;color:#94a3b8">No attachments yet.</span>';
  return `<div class="card ${open?'open':''}" id="card-${f.id}">
    <div class="card-head" onclick="toggleCard('${f.id}')">
      <h3>${esc(f.ref||'(no ref)')} — ${esc(f.client||'Unnamed client')} ${statusTag}</h3>
      <div class="sub">${dur}${f.desc?'<span>📄 '+esc(f.desc.slice(0,60))+(f.desc.length>60?'…':'')+'</span>':''}</div>
      <div class="progress"><div style="width:${p}%"></div></div>
      <div style="font-size:11px;color:#64748b;margin-top:4px">${p}% complete • click to ${open?'collapse':'expand'}</div>
    </div>
    <div class="card-body">
      ${stages}
      <div class="attach">
        <h4>📎 Attachments &amp; Photos</h4>
        <div class="att-list">${atts}</div>
        <label class="btn btn-soft btn-sm" style="margin-top:10px">➕ Add file / photo<input type="file" multiple style="display:none" onchange="addAttach('${f.id}',event)"></label>
      </div>
      ${f.notes?'<div style="margin-top:12px;font-size:12px"><b>Notes:</b> '+esc(f.notes)+'</div>':''}
      <div class="card-foot">
        <button class="btn btn-soft btn-sm" onclick="openModal('${f.id}')">✏️ Edit info</button>
        <button class="btn btn-danger btn-sm" onclick="delFile('${f.id}')">🗑️ Delete</button>
      </div>
    </div>
  </div>`;
}
function stageHTML(f,s){
  const st=f.stages[s.k];
  const sel=v=>st.status===v?'selected':'';
  return `<div class="stage">
    <div class="stage-top">
      <span class="name"><span class="dot ${st.status}"></span>${s.label}</span>
      <select style="width:auto" onchange="setStage('${f.id}','${s.k}','status',this.value)">
        <option value="pending" ${sel('pending')}>Pending</option>
        <option value="progress" ${sel('progress')}>In progress</option>
        <option value="done" ${sel('done')}>Done</option>
      </select>
    </div>
    <div class="stage-fields">
      <div><label class="lbl">Date</label><input type="date" value="${esc(st.date)}" onchange="setStage('${f.id}','${s.k}','date',this.value)"></div>
      <div><label class="lbl">${s.hint}</label><input value="${esc(st.person)}" placeholder="${s.hint}" onchange="setStage('${f.id}','${s.k}','person',this.value)"></div>
      <div class="full"><label class="lbl">Remarks</label><input value="${esc(st.remarks)}" placeholder="Remarks / tracking notes" onchange="setStage('${f.id}','${s.k}','remarks',this.value)"></div>
    </div>
  </div>`;
}
function attHTML(id,a,i){
  const thumb=a.isImg?`<a href="${a.data}" target="_blank"><img src="${a.data}" alt=""></a>`:'📄';
  return `<div class="att-item">${thumb}<a href="${a.data}" download="${esc(a.name)}" title="${esc(a.name)}">${esc(a.name.slice(0,16))}</a><span class="att-x" onclick="delAttach('${id}',${i})">✕</span></div>`;
}

render();
</script>

<script>
/* JM MOBILE — isi data-label setiap sel jadual daripada header (sokong rowspan/colspan).
   Tak sentuh data atau logic; jalan semula bila jadual dirender semula. */
(function(){
  'use strict';
  function txt(el){ return el.textContent.replace(/[▲▼⇅]/g,'').replace(/\s+/g,' ').trim(); }
  function headLabels(table){
    const rows = table.tHead ? Array.from(table.tHead.rows) : [];
    if (!rows.length) return null;
    const grid = [];
    rows.forEach(function(tr, r){
      grid[r] = grid[r] || [];
      let c = 0;
      Array.from(tr.cells).forEach(function(cell){
        while (grid[r][c]) c++;
        const cs = cell.colSpan || 1, rs = cell.rowSpan || 1, t = txt(cell);
        for (let i = 0; i < rs; i++) { grid[r+i] = grid[r+i] || []; for (let j = 0; j < cs; j++) grid[r+i][c+j] = { t: t }; }
        c += cs;
      });
    });
    const n = Math.max.apply(null, grid.map(function(g){ return g.length; }));
    const out = [];
    for (let c = 0; c < n; c++) {
      const parts = [];
      grid.forEach(function(g){ const x = g[c]; if (x && x.t && parts[parts.length-1] !== x.t) parts.push(x.t); });
      out.push(parts.join(' · '));
    }
    return out;
  }
  function label(table){
    const labels = headLabels(table);
    if (!labels) return;
    table.classList.add('jm-cards');
    const n = labels.length;
    Array.from(table.tBodies).forEach(function(tb){
      const occ = [];
      Array.from(tb.rows).forEach(function(tr, r){
        occ[r] = occ[r] || [];
        let c = 0;
        Array.from(tr.cells).forEach(function(cell){
          while (occ[r][c]) c++;
          const cs = cell.colSpan || 1, rs = cell.rowSpan || 1;
          for (let i = 0; i < rs; i++) { occ[r+i] = occ[r+i] || []; for (let j = 0; j < cs; j++) occ[r+i][c+j] = 1; }
          const full = cs > 1 && cs >= Math.ceil(n / 2);
          cell.classList.toggle('jm-full', full);
          const lab = full ? '' : (labels[c] || '');
          if (cell.getAttribute('data-label') !== lab) cell.setAttribute('data-label', lab);
          cell.classList.toggle('jm-nolabel', !full && !lab);
          c += cs;
        });
      });
    });
  }
  let queued = false;
  function run(){ queued = false; document.querySelectorAll('table').forEach(label); }
  function schedule(){ if (!queued) { queued = true; requestAnimationFrame(run); } }
  function start(){
    run();
    new MutationObserver(function(muts){
      for (const m of muts) { if (m.type === 'childList') { schedule(); return; } }
    }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
