<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMC Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   JMC Operations Hub — UI v3 (Executive Command Center)
   Struktur: sidebar indigo tetap + topbar + kawasan kandungan
   (dashboard utama berhierarki + iframe modul). Logik JS asal dikekalkan.
   ============================================================ */
:root{
  --ind-950:#0A2540; --ind-900:#0F2A52; --ind-800:#13346B; --ind-600:#1D4ED8; --ind-500:#3B82F6; --ind-100:#DBEAFE; --ind-50:#EFF6FF;
  --yel:#FACC15; --yel-600:#CA8A04; --yel-50:#FEF9C3; --yel-ink:#0A2540;
  --bg:#F1F5F9; --surface:#ffffff; --line:#E2E8F0; --line2:#F1F5F9;
  --ink:#0F172A; --ink2:#334155; --muted:#64748B;
  --ok:#059669; --ok-50:#ECFDF5;
  --warn:#D97706; --warn-50:#FFFBEB;
  --bad:#DC2626; --bad-50:#FEF2F2;
  --c-rev:#1D4ED8; --c-exp:#D97706;
  --f:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --sb:252px; --top:64px;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --sh-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.03);
  --sh-md:0 4px 14px -2px rgba(15,23,42,.06),0 2px 6px -2px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);font-stretch:100%;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.num-t{font-variant-numeric:tabular-nums}

/* ---------- Sidebar ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--ind-950);color:#c3c5ef;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 18px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--yel);color:var(--ind-950);display:grid;place-items:center;flex:none;position:relative;box-shadow:0 4px 12px rgba(250,204,21,.25)}
.mark svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;color:#fff;font-size:15px;font-weight:750;font-stretch:112%;letter-spacing:.2px;line-height:1.15}
.brand span{font-size:11.5px;color:#9497cf}
.nav{flex:1;overflow:auto;padding:4px 12px 16px}
.grp{font-size:11.5px;color:#8285c4;padding:18px 12px 6px;font-weight:600}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;margin-bottom:2px;border-radius:10px;font-size:13.5px;color:#cfd1f5;cursor:pointer;transition:transform .15s ease,background .15s ease,box-shadow .15s ease}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(4px);box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.nav button.on{background:#fff;color:var(--ind-800);font-weight:650;box-shadow:0 8px 20px -10px rgba(0,0,0,.55)}
.nav button.on:hover{transform:none}
.nav button.on svg{color:var(--ind-600)}
.nav button.on::after{content:"";margin-left:auto;width:7px;height:7px;border-radius:2px;background:var(--yel)}
.nav button:focus-visible{outline:2px solid var(--yel)}
.nav button i,.nav .gh i{width:18px;flex:none;text-align:center;font-size:14px}
.sbfoot{margin:0 12px 14px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);display:grid;gap:8px}
.sbfoot .row{display:flex;gap:6px}
.sbbtn{flex:1;white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:transparent;color:#e3e4fb;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600}
.sbbtn:hover{background:var(--yel);border-color:var(--yel);color:var(--yel-ink)}
.sbfoot small{font-size:11px;color:#8285c4;line-height:1.4}

/* ---------- Main / topbar ---------- */
.main{position:fixed;inset:0 0 0 var(--sb);display:flex;flex-direction:column}
.top{height:var(--top);flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top h1{font-size:17px;font-weight:700;font-stretch:108%;letter-spacing:-.1px;line-height:1.2}
.crumb{font-size:12px;color:var(--muted)}
.sp{flex:1}
.clock{font-size:12.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;padding:6px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--ind-600);color:var(--ind-600)}
.btn.p{background:var(--ind-600);border-color:var(--ind-600);color:#fff}
.btn.p:hover{background:var(--ind-800);border-color:var(--ind-800);color:#fff}
.btn.back{background:var(--yel-50);border-color:#f1dc84;color:var(--yel-ink)}
.btn.back:hover{background:var(--yel);border-color:var(--yel);color:var(--yel-ink)}
.btn i{font-size:13px;width:15px;text-align:center}
.btn[hidden]{display:none}
.burger{display:none;border:0;background:none;padding:6px;margin-left:-6px;border-radius:8px}
.burger i{font-size:19px;color:var(--ink)}
.content{flex:1;position:relative;min-height:0}
#home{position:absolute;inset:0;overflow:auto;padding:20px 26px 48px;scroll-behavior:smooth}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.frame.on{display:block}
.loading{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-size:13px;background:var(--bg)}
.loading.on{display:grid}

/* ---------- Hero: Executive Command Center ---------- */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px;box-shadow:var(--sh-sm)}
.hero-top{position:relative;background:linear-gradient(135deg,var(--ind-950) 0%,var(--ind-800) 100%);color:#fff;padding:20px 24px 18px;overflow:hidden}
.hero .contour{position:absolute;right:-30px;top:-65px;width:540px;height:310px;pointer-events:none;color:var(--yel);opacity:.15}
.hero-head{position:relative;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero-head h2{font-size:23px;font-weight:780;font-stretch:115%;letter-spacing:-.3px;line-height:1.15;color:#fff}
.hero-head p{font-size:12.5px;color:#cbd5e1;margin-top:4px}
.hero-head .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.hero-bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}

/* Live Source Health Pills */
.srcs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.src-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:550;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid rgba(255,255,255,.1)}
.src-pill i.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.src-pill.ok i.dot{background:#34D399;box-shadow:0 0 6px #34D399}
.src-pill.load i.dot{background:var(--yel)}
.src-pill.err i.dot{background:#F87171}

/* Executive Focus Filter Tabs */
.ftabs{display:flex;gap:4px;background:rgba(10,37,64,.45);padding:3px;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
.ftab{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:#cbd5e1;padding:5px 11px;border-radius:7px;transition:background .15s,color .15s;white-space:nowrap}
.ftab:hover{color:#fff;background:rgba(255,255,255,.08)}
.ftab.on{background:var(--yel);color:var(--ind-950);font-weight:700}

/* 8 KPI (4 x 2) */
.kpis{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;padding:15px 18px 16px;min-width:0;position:relative;transition:background .15s;background:var(--surface)}
.kpi:hover{background:#F8FAFC}
.kpi:focus-visible{outline:2px solid var(--ind-600);outline-offset:-2px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;flex:none}
.kpi .ico.b{background:var(--ind-50);color:var(--ind-600)}
.kpi .ico.g{background:var(--ok-50);color:var(--ok)}
.kpi .ico.y{background:var(--warn-50);color:var(--warn)}
.kpi .ico.r{background:var(--bad-50);color:var(--bad)}
.kpi .v{font-size:26px;font-weight:750;font-stretch:112%;margin-top:6px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);line-height:1.15}
.kpi .v small{font-size:13px;font-weight:650;color:var(--muted);margin-right:3px;letter-spacing:0}
.kpi .s{font-size:11.5px;color:var(--ink2);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.pri{background:linear-gradient(180deg,#ffffff 0%,#FAFBFD 100%)}
.kpi.pri::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:transparent;transition:background .15s}
.kpi.pri:hover::before{background:var(--ind-600)}
.kpi.hl .v{color:var(--ind-800)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.warn{background:var(--warn-50);color:var(--warn)}.chip.bad{background:var(--bad-50);color:var(--bad)}.chip.info{background:var(--ind-50);color:var(--ind-600)}.chip.mute{background:var(--line2);color:var(--ink2)}
.hero-top .chip.bad{background:rgba(220,38,38,.25);color:#FECACA;border:1px solid rgba(248,113,113,.35)}
.hero-top .chip.warn{background:rgba(217,119,6,.25);color:#FDE68A;border:1px solid rgba(251,191,36,.35)}
.hero-top .chip.ok{background:rgba(5,150,105,.25);color:#A7F3D0;border:1px solid rgba(52,211,153,.35)}

/* ---------- Sections & Panels ---------- */
.sec-blk{margin-bottom:18px}
.sec-blk.hide{display:none}
.sec-lbl{display:flex;align-items:center;gap:10px;margin:20px 0 11px;font-size:11.5px;font-weight:750;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.sec-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.grid:last-child{margin-bottom:0}
.g21{grid-template-columns:minmax(0,1.85fr) minmax(0,1.15fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g111{grid-template-columns:repeat(3,minmax(0,1fr))}
.g1{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0;box-shadow:var(--sh-sm);display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.ph h3{font-size:14.5px;font-weight:720;font-stretch:106%;display:flex;align-items:center;gap:9px;color:var(--ink)}
.ph h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--yel);flex:none}
.ph .src{font-size:11px;font-weight:550;color:var(--muted);padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.ph .sp{flex:1}
.link{all:unset;cursor:pointer;font-size:12px;font-weight:650;color:var(--ind-600);padding:4px 9px;border-radius:7px;transition:background .15s}
.link:hover{background:var(--ind-50)}
.link:focus-visible{outline:2px solid var(--ind-600)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:auto;padding-top:12px;align-items:center}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--f)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--bg);border-radius:var(--r-md);border:1px dashed var(--line)}

/* Mini Strip inside Panels */
.ministrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.mstat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.mstat span{font-size:11.5px;color:var(--muted);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstat b{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}

/* horizontal bars */
.hb{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;font-size:12.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-weight:600}
.hb .track-bg{background:var(--line2);border-radius:6px;height:12px;overflow:hidden;display:flex}
.hb .track{display:flex;height:100%;border-radius:6px;overflow:hidden;gap:2px}
.hb .track span{height:100%;transition:width .3s ease}
.hb .val{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink);font-weight:650;text-align:right;white-space:nowrap}
.hb .val small{font-weight:500;color:var(--muted);margin-right:6px;font-size:11px}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:650;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td:nth-child(3){white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--ind-50)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.prog{display:flex;align-items:center;gap:8px;min-width:115px}
.prog .bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:4px}
.prog b{font-size:11.5px;font-weight:700;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* alerts */
.af-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.af-btn{all:unset;cursor:pointer;font-size:11px;font-weight:650;padding:4px 9px;border-radius:7px;background:var(--bg);color:var(--ink2);border:1px solid var(--line);transition:all .15s}
.af-btn:hover{border-color:var(--ind-600);color:var(--ind-600)}
.af-btn.on{background:var(--ind-950);color:#fff;border-color:var(--ind-950)}
.alerts{display:grid;gap:7px;max-height:390px;overflow:auto;margin:0 -4px;padding:0 4px}
.al{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border-radius:10px;background:#FAFBFD;cursor:pointer;border:1px solid var(--line);border-left-width:3px;text-align:left;font:inherit;color:inherit;width:100%;transition:transform .12s,border-color .15s,background .15s}
.al[data-sev="bad"]{border-left-color:var(--bad)}
.al[data-sev="warn"]{border-left-color:var(--warn)}
.al[data-sev="info"]{border-left-color:var(--ind-600)}
.al.hide{display:none}
.al:hover{background:var(--ind-50);border-color:var(--ind-100);transform:translateX(2px)}
.al .st{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.al .st.bad{background:var(--bad-50);color:var(--bad)}.al .st.warn{background:var(--warn-50);color:var(--warn)}.al .st.info{background:var(--ind-50);color:var(--ind-600)}
.al .st.bad::before{content:"!"}.al .st.warn::before{content:"•"}.al .st.info::before{content:"i"}
.al b{font-size:12.5px;font-weight:650;display:block;line-height:1.35;color:var(--ink)}
.al span{font-size:11.5px;color:var(--ink2);display:block;margin-top:1px}

/* micro-feed inside Laporan Harian */
.mfeed{display:grid;gap:6px;margin-top:12px}
.mf-item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:#FAFBFD;border:1px solid var(--line);font-size:12px}
.mf-item b{font-weight:650;color:var(--ink)}
.mf-item span{color:var(--ink2);font-size:11.5px}

/* tag pills for drafters/checkers/categories */
.tpills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tpill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.tpill b{color:var(--ind-800);font-weight:750}

/* tracking pipeline: susunan peringkat sebenar fail (1 → 11) */
.pipe{display:grid;gap:4px;position:relative}
.pipe .r{display:grid;grid-template-columns:22px minmax(0,136px) minmax(0,1fr) 26px;gap:10px;align-items:center;font-size:12px}
.pipe .r .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--line2);color:var(--muted);font-variant-numeric:tabular-nums}
.pipe .r.has .k{background:var(--ind-600);color:#fff}
.pipe .r.peak .k{background:var(--yel);color:var(--ind-950)}
.pipe .r .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pipe .r .t{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.pipe .r .t i{display:block;height:100%;background:var(--ind-600);border-radius:5px}
.pipe .r.peak .t i{background:var(--warn)}
.pipe .r b{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:550}
.stat .v{font-size:19px;font-weight:750;font-stretch:110%;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line2)}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}

/* Panel HOD Pelan: Status Pelan | Checklist | QC — 3 lajur sama tinggi */
.panel.pelan{container-type:inline-size}
.pcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
@container (max-width:740px){.pcols{grid-template-columns:minmax(0,1fr)}}
.pcol{min-width:0;border:1px solid var(--line);background:#FAFBFD;border-radius:var(--r-md);padding:14px 15px;display:flex;flex-direction:column}
.psec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:720;color:var(--ind-900);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.psec .link{font-size:11.5px;padding:2px 7px;background:#fff;border:1px solid var(--line)}
.pcol .stats{gap:8px}
.pcol .stat{padding:9px 11px;background:#fff}
.pcol .stat .v{font-size:18px}
.pkv{display:block;margin:10px 0 0;font-size:12.5px}
.pkv dt{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:9px}
.pkv dt:first-child{margin-top:0}
.pkv dd{display:block;margin:3px 0 0;font-weight:600;text-align:left;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;word-break:break-word;line-height:1.45;color:var(--ink)}
.errm{color:var(--bad);font-weight:600;cursor:help;border-bottom:1px dotted currentColor}

/* SVG Donut Gauge */
.donut-wrap{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm)}
.donut-leg{display:grid;gap:4px;font-size:11.5px;flex:1;min-width:0}
.donut-leg div{display:flex;align-items:center;justify-content:space-between;gap:6px}
.donut-leg span{display:flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-leg i{width:8px;height:8px;border-radius:2px;flex:none}

/* Unpopulated Modules Compact Strip */
.setup-strip{background:var(--surface);border:1px dashed #CBD5E1;border-radius:var(--r-lg);padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setup-strip .st-info{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.setup-strip .st-info i{color:var(--ind-600);font-size:15px}
.setup-btns{display:flex;gap:7px;flex-wrap:wrap}
.setup-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);transition:all .15s}
.setup-btn:hover{background:var(--ind-50);border-color:var(--ind-600);color:var(--ind-600)}

/* summary report */
.report{background:linear-gradient(135deg,var(--ind-950) 0%,#0E2E50 100%);color:#e2e8f0;border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sh-md)}
.report .ph h3{color:#fff}
.report .ph .src{background:rgba(255,255,255,.08);color:#cbd5e1;border-color:rgba(255,255,255,.12)}
.report .btn{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
.report .btn:hover{background:var(--yel);border-color:var(--yel);color:var(--yel-ink)}
.report ol{padding-left:20px;display:grid;gap:8px;font-size:13.5px;max-width:98ch;line-height:1.55}
.report ol li::marker{color:var(--yel);font-weight:700}
.report ol b{color:#fff;font-weight:650}

.tip{position:fixed;pointer-events:none;background:var(--ind-950);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:100;opacity:0;transition:opacity .08s;max-width:250px;box-shadow:0 8px 24px rgba(10,37,64,.3)}
.tip.on{opacity:1}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ind-950);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:120;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;border-left:4px solid var(--yel)}
.toast.on{opacity:1;transform:none}
.scrim{display:none}

/* modal (pengesahan restore) */
.modal{position:fixed;inset:0;background:rgba(10,37,64,.5);display:none;place-items:center;z-index:110;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:var(--r-lg);max-width:440px;width:100%;padding:22px 24px;border-top:4px solid var(--yel)}
.modal h4{font-size:16px;font-weight:700;margin-bottom:6px}
.modal p{font-size:13px;color:var(--ink2);margin-bottom:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}

/* item nav + mod "rail" bila aplikasi folder dibuka */
.nav button .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button .tag{margin-left:auto;font-size:10px;font-weight:650;color:#8285c4;border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:0 5px;line-height:16px}
.nav button.on .tag{display:none}
.stat[data-go]{cursor:pointer;transition:background .15s,border-color .15s}
.stat[data-go]:hover{background:var(--ind-50);border-color:var(--ind-100)}

/* ---------- Nav dropdown: main nav (.gh) + sub nav (.sub) ---------- */
.nav{padding-top:8px}
.ngrp{margin-bottom:2px}
.nav .chev{margin-left:auto;opacity:.65;font-size:12px;transition:transform .2s ease,opacity .15s}
.nav .gh:hover .chev{opacity:1}
.ngrp.open>.gh .chev{transform:rotate(180deg)}
.nav .gh.has-on{color:#fff;font-weight:650;background:rgba(255,255,255,.06)}
.nav .gh.has-on>i:first-child{color:var(--yel)}
.ngrp:not(.open)>.gh.has-on .tx::after{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--yel);margin-left:8px;vertical-align:2px}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.ngrp.open>.sub{grid-template-rows:1fr}
.sub>div{min-height:0;overflow:hidden;visibility:hidden;transition:visibility .22s}
.ngrp.open>.sub>div{visibility:visible}
.sub .inner{margin:2px 0 6px 20px;padding-left:10px;border-left:1px solid rgba(255,255,255,.12)}
.nav .sub button{padding:7px 10px;font-size:13px;color:#b9bbe8}
.nav .sub button:hover{color:#fff}
.nav .sub button.on{color:var(--ind-800)}
.nsep{height:1px;background:rgba(255,255,255,.1);margin:10px 10px}
@media (min-width:861px){
  .sb{transition:width .18s ease}
  .main{transition:left .18s ease}
  body.rail .main{left:72px}
  body.rail .sb:not(:hover){width:72px}
  body.rail .sb:hover{box-shadow:16px 0 40px rgba(10,37,64,.35)}
  body.rail .sb:not(:hover) .brand{justify-content:center;padding:20px 0 18px}
  body.rail .sb:not(:hover) .brand>div:last-child,
  body.rail .sb:not(:hover) .nav .tx,
  body.rail .sb:not(:hover) .nav .tag,
  body.rail .sb:not(:hover) .nav .chev,
  body.rail .sb:not(:hover) .nav .sub,
  body.rail .sb:not(:hover) .sbfoot{display:none}
  body.rail .sb:not(:hover) .nav .gh.has-on{background:#fff;color:var(--ind-800)}
  body.rail .sb:not(:hover) .nav .gh.has-on>i:first-child{color:var(--ind-600)}
  body.rail .sb:not(:hover) .grp{font-size:0;height:1px;padding:0;margin:10px 10px;background:rgba(255,255,255,.12)}
  body.rail .sb:not(:hover) .nav{padding:4px 12px 16px;overflow-x:hidden}
  body.rail .sb:not(:hover) .nav button{justify-content:center;padding:10px 0}
  body.rail .sb:not(:hover) .nav button.on::after{display:none}
}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.g21,.g11,.g111{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .sb{transform:translateX(-100%)}
  body.nav-open .sb{transform:none;box-shadow:12px 0 40px rgba(10,37,64,.35)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,37,64,.4);z-index:55}
  .main{left:0}

  .ministrip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .kpi .v{font-size:22px}
  .hb{grid-template-columns:minmax(0,90px) minmax(0,1fr) auto}
  .pipe .r{grid-template-columns:22px minmax(0,96px) minmax(0,1fr) 22px}
  .top .btn span{display:none}
  .panel{padding:16px}
}
@media print{
  body{overflow:visible;background:#fff}

  .main{position:static}.content{position:static}#home{position:static;overflow:visible;padding:0}
  .sec-blk{display:block!important}

  .report{background:#fff;color:var(--ink);border:1px solid var(--line)}.report .ph h3,.report ol b{color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Untuk nilai dalam data-tip: getAttribute() decode entity sekali, lepas tu tip.innerHTML parse sekali lagi.
   Jadi data luar (nama klien, pemegang peralatan dari Google Sheets) mesti di-escape DUA kali supaya kekal teks. */
const escA=s=>esc(esc(s));
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const rm=n=>'RM '+Math.round(n||0).toLocaleString('en-MY');
const rmK=n=>{n=n||0;return Math.abs(n)>=1e6?'RM '+(n/1e6).toFixed(2)+'j':Math.abs(n)>=1e3?'RM '+(n/1e3).toFixed(1)+'k':'RM '+Math.round(n);};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const parseD=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;};
const dmy=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'–';
const daysTo=d=>Math.round((d-today())/864e5);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
const stripHTML=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d;};

/* ================= FRAMES ================= */
const frames={};const ready={};
function makeFrame(id){
  const f=document.createElement('iframe');
  f.className='frame';f.id='fr-'+id;f.title=id;
  f.addEventListener('load',()=>{ready[id]=true;onFrameReady(id);});
  f.src=modUrl(id);
  $('#content').appendChild(f);frames[id]=f;
}
function makeApp(k){
  const key='app:'+k,f=document.createElement('iframe');
  f.className='frame';f.name='jm-app-'+k;f.title=APPS[k].t;f.setAttribute('allow','clipboard-write');
  f.addEventListener('load',()=>{
    ready[key]=true;
    if(current===key)$('#loading').classList.remove('on');
    if(k==='pelan-status'){
      let tries=0;
      const pollPelan=setInterval(()=>{
        scheduleRender();
        if(++tries>=12)clearInterval(pollPelan);
      },1000);
    }
    if(k==='bim'){scheduleRender();setTimeout(scheduleRender,900);setTimeout(scheduleRender,2200);setTimeout(scheduleRender,4500);}
    if(k==='akaun'){setTimeout(()=>collectAkaun(false),900);}
  });
  f.src=appUrl(k);$('#content').appendChild(f);frames[key]=f;
}
function win(id){try{const w=frames[id]&&ready[id]?frames[id].contentWindow:null;if(w)void w.document;return w;}catch(e){return null;}}
function onFrameReady(id){
  if(id==='ops')try{
    const w=win('ops');
    if(w&&typeof w.go==='function'&&!w.go._jm){
      const orig=w.go;const wrapped=function(p){orig(p);if(current.startsWith('ops:')&&current!=='ops:'+p)setActive('ops:'+p,true);};
      wrapped._jm=true;w.go=wrapped;
      if(pendingOps){orig(pendingOps);pendingOps=null;}
    }
  }catch(e){}
  if(Object.keys(MODULES).every(k=>ready[k]))scheduleRender();
}

/* ================= ROUTER ================= */
let current='home',pendingOps=null;
function setActive(v,fromFrame){
  current=v;
  document.querySelectorAll('#nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('#nav .ngrp').forEach(g=>{const has=!!g.querySelector('button.on');g.querySelector('.gh').classList.toggle('has-on',has);if(has)setGroup(g,true,false);});
  const [mod,sub]=v.split(':');
  if(mod==='home'){$('#pgTitle').textContent='Dashboard Utama';$('#pgCrumb').textContent='Ringkasan semua modul';}
  else if(mod==='ops'){$('#pgTitle').textContent=OPS_TITLES[sub]||'Operasi';$('#pgCrumb').textContent='Operasi HOD';}
  else if(mod==='app'){$('#pgTitle').textContent=APPS[sub].t;$('#pgCrumb').textContent=APPS[sub].c;}
  else{$('#pgTitle').textContent=MOD_TITLES[mod][0];$('#pgCrumb').textContent=MOD_TITLES[mod][1];}
  $('#btnPrint').style.display=mod==='home'?'':'none';
  $('#btnBack').hidden=mod==='home';
  $('#btnOpen').hidden=!(mod==='app'||(mod!=='ops'&&MODULES[mod]));
  document.body.classList.toggle('rail',mod==='app');
  if(location.hash.slice(1)!==v.replace(':','-'))history.replaceState(null,'','#'+v.replace(':','-'));
}
function show(v){
  let [mod,sub]=v.split(':');
  if(mod==='app'&&!APPS[sub]){v='home';mod='home';}
  setActive(v);
  const key=mod==='app'?'app:'+sub:mod;
  if(mod==='app'&&!frames[key])makeApp(sub);
  $('#home').style.display=mod==='home'?'':'none';
  Object.keys(frames).forEach(k=>frames[k].classList.toggle('on',k===key));
  $('#loading').classList.toggle('on',mod!=='home'&&!ready[key]);
  if(mod==='ops'){const w=win('ops');try{if(w&&w.go)w.go(sub);else pendingOps=sub;}catch(e){pendingOps=sub;}}
  if(mod==='home')render();
  document.body.classList.remove('nav-open');
}
window.addEventListener('message',e=>{
  if(!e.data||e.data.jmHub!=='nested')return;
  const k=Object.keys(frames).find(k=>frames[k].contentWindow===e.source);
  if(k&&k.startsWith('app:'))frames[k].src=appUrl(k.slice(4));
  show('home');
});

function setGroup(g,open,save){
  g.classList.toggle('open',open);g.querySelector('.gh').setAttribute('aria-expanded',String(open));

}
document.querySelectorAll('#nav .ngrp').forEach(g=>setGroup(g,navOpen[g.dataset.g]===true,false));
document.getElementById('nav').addEventListener('click',e=>{

});

function readOps(){const w=win('ops');try{if(w&&w.DB&&w.DB.site_projects)return w.DB;}catch(e){}return lsGet(KEYS.ops);}
function readInv(){return EXT.inv;}
function normDrStatus(st){
  const s=String(st||'').toLowerCase();
  if(/siap|lulus|dilulus|done|complete|approved/.test(s))return 'Diluluskan';
  if(/semak|review|qc|check/.test(s))return 'Dalam Semakan';
  if(/sedang|proses|jalan|progress|aktif|wip/.test(s))return 'Penyediaan Plan';
  return 'Belum Mula';
}
function readDrafter(){
  const p=lsGet('drafter_projects_data');const projName={};(Array.isArray(p)?p:[]).forEach(x=>{projName[x.id]=x.name;});
  // 1. Baca terus dari iframe Status Pelan yang disegerak dengan Google Sheets (keutamaan tertinggi)
  const w=win('app:pelan-status');
  if(w){
    try{
      const cand=w.drawings||(w.state&&w.state.drawings)||(w.APP_STATE&&w.APP_STATE.drawings)||(w.data&&w.data.drawings);
      if(Array.isArray(cand)&&cand.length){
        try{localStorage.setItem('jm_pelan_status_cache_v1',JSON.stringify(cand));}catch(e){}
        return {drawings:cand,projName:projName};
      }
    }catch(e){}
    try{
      const txt=(w.document&&w.document.body&&w.document.body.innerText)||'';
      const mTot=txt.match(/Jumlah\s+Lukisan[\s\S]{0,40}?(\d+)/i);
      const mSiap=txt.match(/\bSiap[\s\S]{0,30}?(\d+)\s*\/\s*(\d+)/i);
      if(mTot||mSiap){
        const tot=mSiap?+mSiap[2]:+mTot[1];
        const done=mSiap?+mSiap[1]:0;
        const mJalan=txt.match(/(\d+)\s*Sedang\s*Berjalan/i);
        const mSemak=txt.match(/(\d+)\s*Dalam\s*Semakan/i);
        const mMula=txt.match(/(\d+)\s*Belum\s*Mula/i);
        const mIsu=txt.match(/(\d+)\s*Projek\s*Ada\s*Isu/i);
        const nSemak=mSemak?+mSemak[1]:0;
        const nMula=mMula?+mMula[1]:0;
        const nJalan=mJalan?+mJalan[1]:Math.max(0,tot-done-nSemak-nMula);
        const out=[];
        for(let i=0;i<done;i++)out.push({status:'Diluluskan',progress:100});
        for(let i=0;i<nJalan;i++)out.push({status:'Penyediaan Plan',progress:50});
        for(let i=0;i<nSemak;i++)out.push({status:'Dalam Semakan',progress:80});
        for(let i=0;i<nMula;i++)out.push({status:'Belum Mula',progress:0});
        while(out.length<tot)out.push({status:'Penyediaan Plan',progress:50});
        const isuCnt=mIsu?+mIsu[1]:0;
        if(isuCnt>0&&out.length>done)out[done].targetDate='2000-01-01';
        if(out.length){
          try{localStorage.setItem('jm_pelan_status_cache_v1',JSON.stringify(out));}catch(e){}
          return {drawings:out,projName:projName};
        }
      }
    }catch(e){}
  }
  // 2. Fallback cache terakhir dari Status Pelan (elak papar data lama 9 lukisan semasa iframe sedang memuatkan)
  const cached=lsGet('jm_pelan_status_cache_v1');
  if(Array.isArray(cached)&&cached.length)return {drawings:cached,projName:projName};
  // 3. Fallback kunci localStorage lama jika belum pernah segerak dengan Google Sheets
  const d=lsGet('drafter_drawings_data');
  if(Array.isArray(d)&&d.length)return {drawings:d,projName:projName};
  return null;
}
function readTrack(){const d=lsGet(KEYS.tracking);return Array.isArray(d)?d:[];}
function normBimStatus(st){
  const s=String(st||'').toLowerCase();
  if(/siap|selesai|done|complete|handover/.test(s))return BIM_DONE;
  if(/sheet/.test(s))return 'Sheet Final';
  if(/draft/.test(s))return 'Drafting';
  if(/process/.test(s))return 'Processing';
  if(/site|lapangan|scan/.test(s))return 'On-Site';
  return 'Belum Mula';
}
function dmyToIso(s){
  const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:'';
}
function readBIM(){
  // 1. Semak localStorage (jika pengguna pernah simpan/ubah dalam browser)
  const p=lsGet(BIM_KEYS.proj);
  if(Array.isArray(p)&&p.length){
    const s=lsGet(BIM_KEYS.staff),r=lsGet(BIM_KEYS.rpt);
    return {projects:p,staff:Array.isArray(s)?s:[],reports:Array.isArray(r)?r:[]};
  }
  // 2. Baca terus daripada iframe HOD BIM (Database live / state / jadual DOM)
  const w=win('app:bim');
  if(w){
    try{
      const cand=w.projects||(w.state&&w.state.projects)||(w.APP_STATE&&w.APP_STATE.projects)||(w.db&&w.db.projects)||(w.data&&w.data.projects);
      if(Array.isArray(cand)&&cand.length){
        const stf=(w.staff||(w.state&&w.state.staff)||(w.db&&w.db.staff)||[]);
        const rpt=(w.reports||(w.state&&w.state.reports)||(w.db&&w.db.reports)||[]);
        const out={projects:cand,staff:Array.isArray(stf)?stf:[],reports:Array.isArray(rpt)?rpt:[]};
        try{localStorage.setItem('jm_bim_summary_v1',JSON.stringify(out));}catch(e){}

    else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(ch!=='\r')cur+=ch;}

}

/* ================= CHARTS & VISUAL HELPERS ================= */
function niceStep(m){const p=Math.pow(10,Math.floor(Math.log10(m||1)));const n=m/p;return (n<=2?0.5:n<=5?1:2)*p;}
function groupBars(data,series){
  const W=620,H=240,pl=48,pr=8,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  let max=0;data.forEach(d=>series.forEach(s=>{max=Math.max(max,+d[s.k]||0);}));
  const step=niceStep(max||1),top=Math.ceil((max||1)/step)*step;
  let g='';for(let y=0;y<=top+1e-9;y+=step){const yy=pt+ih-(y/top)*ih;g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E2E8F0"/><text x="${pl-8}" y="${yy+3.5}" font-size="10.5" fill="#64748B" text-anchor="end">${y}k</text>`;}
  const n=data.length,bw=iw/n,inner=Math.min(bw*0.62,58),gw=inner/series.length;
  let b='';data.forEach((d,i)=>{const x0=pl+i*bw+(bw-inner)/2;
    series.forEach((s,j)=>{const v=+d[s.k]||0,h=Math.max(0,(v/top)*ih),x=x0+j*gw,y=pt+ih-h,w=gw-2,r=Math.min(4,h,w/2);
      const path=h>0?`M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${pt+ih}Z`:'';
      b+=`<path d="${path}" fill="${s.c}"/><rect x="${x-1}" y="${pt}" width="${w+2}" height="${ih}" fill="transparent" data-tip="<b>${escA(d.m)}</b> · ${escA(s.l)}<br>RM ${(v*1000).toLocaleString('en-MY')}"/>`;});
    b+=`<text x="${pl+i*bw+bw/2}" y="${H-9}" font-size="11.5" fill="#334155" text-anchor="middle">${esc(d.m)}</text>`;});
  const last=data[n-1];if(last){series.forEach((s,j)=>{const v=+last[s.k]||0,x=pl+(n-1)*bw+(bw-inner)/2+j*gw+(gw-2)/2,y=pt+ih-(v/top)*ih-5;b+=`<text x="${x}" y="${y}" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">${v}k</text>`;});}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta hasil vs belanja">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="#CBD5E1"/>${b}</svg>`;
}
function hbStack(label,parts,total,valTxt,subTxt){
  const sum=parts.reduce((a,p)=>a+p.v,0)||1;
  const pct=total>0?Math.min(100,Math.max(8,sum/total*100)):100;
  return `<div class="hb"><div class="n" title="${esc(label)}">${esc(label)}</div><div class="track-bg"><div class="track" style="width:${pct}%">${parts.filter(p=>p.v>0).map(p=>`<span style="width:${p.v/sum*100}%;background:${p.c}" data-tip="<b>${escA(label)}</b><br>${escA(p.l)}: ${escA(p.t||p.v)}"></span>`).join('')}</div></div><div class="val">${subTxt?`<small>${subTxt}</small>`:''}${valTxt}</div></div>`;

function progCell(p,col){p=Math.max(0,Math.min(100,+p||0));col=col||(p>=100?'var(--ok)':'var(--ind-600)');return `<div class="prog"><div class="bar"><i style="width:${p}%;background:${col}"></i></div><b>${p}%</b></div>`;}
function svgDonut(segs,centerVal,centerSub){
  const tot=segs.reduce((a,s)=>a+s.v,0);

        <div class="pipe">${STAGES.map(([k,l],i)=>{const cnt=stageCount[k],isPeak=cnt>0&&cnt===maxS;return `<div class="r${cnt?' has':''}${isPeak?' peak':''}"><div class="k">${i+1}</div><div class="n" title="${esc(l)}">${l}</div><div class="t"><i style="width:${cnt/maxS*100}%" data-tip="${l}: ${cnt} fail"></i></div><b>${cnt}</b></div>`;}).join('')}</div>

      ${hasHR?`<div class="panel">

        ${deptRows.length?`<div style="margin-top:12px">${deptRows.map(([k,n])=>`<div class="hb"><div class="n" title="${esc(k||'–')}">${esc(k||'Tiada jabatan')}</div><div class="track-bg"><div class="track" style="width:${n/maxD*100}%"><span style="width:100%;background:var(--ind-600)" data-tip="${escA(k||'Tiada jabatan')}: ${n} orang"></span></div></div><div class="val">${n}</div></div>`).join('')}</div>`:''}

  // --- COMPACT SETUP STRIP FOR UNPOPULATED LOCAL MODULES
  const unpop=[];
  if(!BIM)unpop.push({go:'app:bim',lbl:'HOD BIM'});

  // --- summary report (Utamakan modul yang aktif, gabung modul kosong di baris akhir)
  const R=[],R_empty=[];
  R.push(`<b>Kerja ukur:</b> ${SS?`${SF.length} fail dalam Status Site — ${ssN.done} selesai, ${ssN.prog} dalam progres, ${ssN.new} baru direkod, ${ssLate.length} lewat jangka siap. Purata progres ${ssAvg}%${ssSoon.length?`, ${ssSoon.length} fail dengan jangka siap dalam 14 hari`:''}.`:'data Status Site belum dimuat.'}`);

  if(BIM)R.push(`<b>BIM:</b> ${BP.length} fail Scan to BIM — ${bimAct.length} aktif (purata ${bimAvg}%), ${bimSt[BIM_DONE]} siap${bimOver.length?`, ${bimOver.length} lewat tarikh akhir`:''}${bimSoon.length?`, ${bimSoon.length} tamat dalam 14 hari`:''}. ${bimHrs7.toLocaleString('en-MY')} jam kerja dilapor minggu ini.`);else R_empty.push('HOD BIM');

  if(AK)R.push(`<b>Kewangan (HOD Akaun):</b> Jumlah jualan keseluruhan ${rm(akSales)} (${AK.files} fail) — ${rm(akPaid)} invois dibayar (${akPaidInv} invois, ${akSales?Math.round(akPaid/akSales*100):0}%), ${rm(akUnpaid)} invois belum dibayar (${akUnpaidInv} invois), dan ${rm(akUnbilled)} belum dituntut (${akUnbilledRec} rekod).`);
  else if(opsBilled>0||expT>0)R.push(`<b>Kewangan:</b> ${rm(opsBilled)} telah diinvois, ${rm(opsPaid)} diterima (${opsBilled?Math.round(opsPaid/opsBilled*100):0}%). Baki belum dibayar ${rm(opsOutst)}. Perbelanjaan direkod ${rm(expT)}.`);
  else R_empty.push('Kewangan');
  R.push(`<b>Pelan:</b> ${DRW?`${DL.length} lukisan dalam Status Pelan — ${drSt['Diluluskan']} diluluskan, ${drSt['Dalam Semakan']} dalam semakan, ${drSt['Penyediaan Plan']} dalam penyediaan, ${drSt['Belum Mula']} belum mula${drOver.length?`, ${drOver.length} melepasi sasaran`:''}. `:''}${EXT.ck?`Checklist: ${CKS.length} helaian — ${ckN.APPROVED} lulus, ${ckN.PENDING_CHECK} menunggu semakan, ${ckN.RETURNED} dipulangkan, ${ckN.DRAFT} draf${ckMulti.length?`, ${ckMulti.length} dah 3 round ke atas`:''}.`:''}${ckFirstRate!=null?` Kadar lulus pusingan 1: ${ckFirstRate}%.`:''}`);
  if(QX.length)R.push(`<b>Kualiti pelan (QC):</b> ${QX.length} fail — ${qxPass} lulus, ${qxProg} dalam proses, ${qxRw.length} perlu rework; kadar rework keseluruhan ${qxRwRate}%.`);

$('#bkExport').onclick=()=>{
  // flush in-memory state of modules that only save on demand
  try{const w=win('quotation');if(w&&w.saveLocal)w.saveLocal();}catch(e){}
  const out={app:'JMC Operations Hub',version:1,exported:new Date().toISOString(),data:{}};
  [...Object.values(KEYS),...EXTRA_KEYS].forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)out.data[k]=v;}catch(e){}});
  try{const o=readOps();if(o&&!out.data[KEYS.ops])out.data[KEYS.ops]=JSON.stringify(o);}catch(e){}
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();a.download='JMC_Backup_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Backup dimuat turun');
};
let pendingRestore=null;
$('#bkImport').onclick=()=>$('#bkFile').click();
$('#bkFile').onchange=function(){const f=this.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=e=>{try{const j=JSON.parse(e.target.result);if(!j||!j.data||typeof j.data!=='object')throw 0;
    const allowed=[...Object.values(KEYS),...EXTRA_KEYS];const keys=Object.keys(j.data).filter(k=>allowed.includes(k));
    if(!keys.length)throw 0;pendingRestore={data:j.data,keys:keys};
    $('#modalTxt').textContent='Fail backup bertarikh '+(j.exported?dmy(new Date(j.exported)):'tidak diketahui')+' mengandungi '+keys.length+' set data. Data semasa akan diganti dan app dimuat semula.';
    $('#modal').classList.add('on');}catch(err){toast('Fail backup tidak sah');}this.value='';};rd.readAsText(f);};
$('#mNo').onclick=()=>{pendingRestore=null;$('#modal').classList.remove('on');};
$('#mYes').onclick=()=>{if(!pendingRestore)return;try{pendingRestore.keys.forEach(k=>{const v=pendingRestore.data[k];localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));});location.reload();}catch(e){toast('Gagal pulihkan: '+e.message);}};
