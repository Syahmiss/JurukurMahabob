<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMC Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   JMC Operations Hub — UI v2 (GEO-STAT: light, indigo + kuning)
   Struktur: sidebar indigo tetap + topbar + kawasan kandungan
   (dashboard utama ATAU iframe modul). Logik JS tidak berubah.
   ============================================================ */
:root{
  --ind-950:#0A2540; --ind-900:#0F2A52; --ind-800:#13346B; --ind-600:#1D4ED8; --ind-500:#3B82F6; --ind-100:#DBEAFE; --ind-50:#EFF6FF;
  --yel:#FACC15; --yel-600:#CA8A04; --yel-50:#FEF9C3; --yel-ink:#0A2540;
  --bg:#F8FAFC; --surface:#ffffff; --line:#E2E8F0; --line2:#EEF2F6;
  --ink:#1E293B; --ink2:#334155; --muted:#64748B;
  --ok:#0f7a43; --ok-50:#e5f4ec; --warn:#B45309; --warn-50:#FEF3C7; --bad:#DC2626; --bad-50:#FEE2E2;
  --c-rev:#1D4ED8; --c-exp:#CA8A04;
  --f:'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --sb:252px; --top:64px;
  --r-lg:16px; --r-md:10px; --r-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);font-stretch:100%;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.num-t{font-variant-numeric:tabular-nums}

/* ---------- Sidebar ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--ind-950);color:#c3c5ef;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 18px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--yel);color:var(--ind-950);display:grid;place-items:center;flex:none;position:relative}
.mark svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;color:#fff;font-size:15px;font-weight:750;font-stretch:112%;letter-spacing:.2px;line-height:1.15}
.brand span{font-size:11.5px;color:#9497cf}
.nav{flex:1;overflow:auto;padding:4px 12px 16px}
.grp{font-size:11.5px;color:#8285c4;padding:18px 12px 6px;font-weight:600}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;margin-bottom:2px;border-radius:10px;font-size:13.5px;color:#cfd1f5;cursor:pointer;transition:transform .15s ease,background .15s ease,box-shadow .15s ease}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(4px);box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.nav button.on{background:#fff;color:var(--ind-800);font-weight:650;box-shadow:0 8px 20px -10px rgba(0,0,0,.55)}
.nav button.on:hover{transform:none}
.nav button.on svg{color:var(--ind-600)}
.nav button.on::after{content:"";margin-left:auto;width:7px;height:7px;border-radius:2px;background:var(--yel)}
.nav button:focus-visible{outline:2px solid var(--yel)}
.nav button i,.nav .gh i{width:18px;flex:none;text-align:center;font-size:14px}
.sbfoot{margin:0 12px 14px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);display:grid;gap:8px}
.sbfoot .row{display:flex;gap:6px}
.sbbtn{flex:1;white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:transparent;color:#e3e4fb;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600}
.sbbtn:hover{background:var(--yel);border-color:var(--yel);color:var(--yel-ink)}
.sbfoot small{font-size:11px;color:#8285c4;line-height:1.4}

/* ---------- Main / topbar ---------- */
.main{position:fixed;inset:0 0 0 var(--sb);display:flex;flex-direction:column}
.top{height:var(--top);flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top h1{font-size:17px;font-weight:700;font-stretch:108%;letter-spacing:-.1px;line-height:1.2}
.crumb{font-size:12px;color:var(--muted)}
.sp{flex:1}
.clock{font-size:12.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:8px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--ind-600);color:var(--ind-600)}
.btn.p{background:var(--ind-600);border-color:var(--ind-600);color:#fff}
.btn.p:hover{background:var(--ind-800);border-color:var(--ind-800);color:#fff}
.btn.back{background:var(--yel-50);border-color:#f1dc84;color:var(--yel-ink)}
.btn.back:hover{background:var(--yel);border-color:var(--yel);color:var(--yel-ink)}
.btn i{font-size:13px;width:15px;text-align:center}
.btn[hidden]{display:none}
.burger{display:none;border:0;background:none;padding:6px;margin-left:-6px;border-radius:8px}
.burger i{font-size:19px;color:var(--ink)}
.content{flex:1;position:relative;min-height:0}
#home{position:absolute;inset:0;overflow:auto;padding:22px 26px 44px}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.frame.on{display:block}
.loading{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-size:13px;background:var(--bg)}
.loading.on{display:grid}

/* ---------- Hero: tajuk + jalur KPI (elemen utama) ---------- */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}
.hero .contour{position:absolute;right:-40px;top:-60px;width:520px;height:300px;pointer-events:none;color:var(--ind-600);opacity:.13}
.hero-head{position:relative;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:20px 24px 18px}
.hero-head h2{font-size:26px;font-weight:780;font-stretch:118%;letter-spacing:-.4px;line-height:1.1;color:var(--ind-950)}
.hero-head p{font-size:12.5px;color:var(--muted);margin-top:5px}
.hero-head .chips{display:flex;gap:6px;flex-wrap:wrap}
.kpis{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);background:linear-gradient(var(--surface),var(--bg))}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:15px 18px 16px;border-left:1px solid var(--line);min-width:0;position:relative;transition:background .15s}
.kpi:first-child{border-left:0}
.kpi:hover{background:var(--ind-50)}
.kpi:focus-visible{outline:2px solid var(--ind-600);outline-offset:-2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:27px;font-weight:720;font-stretch:112%;margin-top:4px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);line-height:1.15}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2);margin-right:3px;letter-spacing:0}
.kpi .s{font-size:11.5px;color:var(--ink2);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.hl .v{display:inline-block;max-width:100%;background:linear-gradient(transparent 66%,var(--yel) 66%,var(--yel) 92%,transparent 92%)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-50);color:var(--ok)}.chip.warn{background:var(--warn-50);color:var(--warn)}.chip.bad{background:var(--bad-50);color:var(--bad)}.chip.info{background:var(--ind-50);color:var(--ind-600)}.chip.mute{background:var(--line2);color:var(--ink2)}

/* ---------- Panels ---------- */
.grid{display:grid;gap:16px;margin-bottom:16px}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g111{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h3{font-size:14.5px;font-weight:700;font-stretch:106%;display:flex;align-items:center;gap:9px}
.ph h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--yel)}
.ph .src{font-size:11.5px;color:var(--muted);padding:2px 8px;border-radius:6px;background:var(--bg)}
.ph .sp{flex:1}
.link{all:unset;cursor:pointer;font-size:12px;font-weight:650;color:var(--ind-600);padding:4px 8px;border-radius:7px}
.link:hover{background:var(--ind-50)}
.link:focus-visible{outline:2px solid var(--ind-600)}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px;align-items:center}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--f)}
.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:12.5px}

/* horizontal bars */
.hb{display:grid;grid-template-columns:minmax(0,132px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;font-size:12.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.hb .track{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--line2);gap:2px}
.hb .track span{height:100%}
.hb .val{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink);font-weight:650;min-width:50px;text-align:right}

/* tables */
.tw{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;}
td:nth-child(3){white-space:nowrap}
td{border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover td{background:#eff6ff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.prog .bar{flex:1;height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:4px}
.prog b{font-size:11.5px;font-weight:650;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* alerts */
.alerts{display:grid;gap:6px;max-height:340px;overflow:auto;margin:0 -4px;padding:0 4px}
.al{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border-radius:10px;background:transparent;cursor:pointer;border:1px solid var(--line2);text-align:left;font:inherit;color:inherit;width:100%;transition:border-color .15s,background .15s}
.al:hover{background:var(--ind-50);border-color:var(--ind-100)}
.al .st{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800}
.al .st.bad{background:var(--bad-50);color:var(--bad)}.al .st.warn{background:var(--warn-50);color:var(--warn)}.al .st.info{background:var(--ind-50);color:var(--ind-600)}
.al .st.bad::before{content:"!"}.al .st.warn::before{content:"•"}.al .st.info::before{content:"i"}
.al b{font-size:12.5px;font-weight:650;display:block;line-height:1.35}
.al span{font-size:11.5px;color:var(--ink2)}

/* tracking pipeline: susunan peringkat sebenar fail (1 → 11) */
.pipe{display:grid;gap:3px;position:relative}
.pipe .r{display:grid;grid-template-columns:22px minmax(0,140px) minmax(0,1fr) 26px;gap:10px;align-items:center;font-size:12px}
.pipe .r .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--line2);color:var(--ink2);font-variant-numeric:tabular-nums}
.pipe .r.has .k{background:var(--ind-600);color:#fff}
.pipe .r .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe .r .t{height:12px;background:var(--line2);border-radius:4px;overflow:hidden}
.pipe .r .t i{display:block;height:100%;background:var(--ind-600);border-radius:4px}
.pipe .r b{font-variant-numeric:tabular-nums;text-align:right;font-weight:650}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:var(--r-md);padding:11px 13px}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:720;font-stretch:110%;font-variant-numeric:tabular-nums;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;margin-top:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:550;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}

/* summary report */
.report{background:var(--ind-950);color:#dfe0fa;border-radius:var(--r-lg);padding:20px 24px}
.report .ph h3{color:#fff}
.report .ph .src{background:rgba(255,255,255,.08);color:#a9abe0}
.report .btn{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
.report .btn:hover{background:var(--yel);border-color:var(--yel);color:var(--yel-ink)}
.report ol{padding-left:20px;display:grid;gap:8px;font-size:13.5px;max-width:96ch;line-height:1.55}
.report ol li::marker{color:var(--yel);font-weight:700}
.report ol b{color:#fff;font-weight:650}

.tip{position:fixed;pointer-events:none;background:var(--ind-950);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:100;opacity:0;transition:opacity .08s;max-width:250px;box-shadow:0 8px 24px rgba(10,37,64,.3)}
.tip.on{opacity:1}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ind-950);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:120;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;border-left:4px solid var(--yel)}
.toast.on{opacity:1;transform:none}
.scrim{display:none}

/* modal (pengesahan restore) */
.modal{position:fixed;inset:0;background:rgba(10,37,64,.5);display:none;place-items:center;z-index:110;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:var(--r-lg);max-width:440px;width:100%;padding:22px 24px;border-top:4px solid var(--yel)}
.modal h4{font-size:16px;font-weight:700;margin-bottom:6px}
.modal p{font-size:13px;color:var(--ink2);margin-bottom:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}

/* item nav + mod "rail" bila aplikasi folder dibuka (aplikasi ada sidebar sendiri) */
.nav button .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button .tag{margin-left:auto;font-size:10px;font-weight:650;color:#8285c4;border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:0 5px;line-height:16px}
.nav button.on .tag{display:none}
.stat[data-go]{cursor:pointer;transition:background .15s}
.stat[data-go]:hover{background:var(--ind-50)}

/* ---------- Nav dropdown: main nav (.gh) + sub nav (.sub) ---------- */
.nav{padding-top:8px}
.ngrp{margin-bottom:2px}
.nav .chev{margin-left:auto;opacity:.65;font-size:12px;transition:transform .2s ease,opacity .15s}
.nav .gh:hover .chev{opacity:1}
.ngrp.open>.gh .chev{transform:rotate(180deg)}
.nav .gh.has-on{color:#fff;font-weight:650;background:rgba(255,255,255,.06)}
.nav .gh.has-on>i:first-child{color:var(--yel)}
/* titik kuning pada main nav bila sub aktif tersembunyi dalam dropdown tertutup */
.ngrp:not(.open)>.gh.has-on .tx::after{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--yel);margin-left:8px;vertical-align:2px}
/* animasi tinggi auto: grid-rows 0fr → 1fr */
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.ngrp.open>.sub{grid-template-rows:1fr}
.sub>div{min-height:0;overflow:hidden;visibility:hidden;transition:visibility .22s}
.ngrp.open>.sub>div{visibility:visible}
.sub .inner{margin:2px 0 6px 20px;padding-left:10px;border-left:1px solid rgba(255,255,255,.12)}
.nav .sub button{padding:7px 10px;font-size:13px;color:#b9bbe8}
.nav .sub button:hover{color:#fff}
.nav .sub button.on{color:var(--ind-800)}
.nsep{height:1px;background:rgba(255,255,255,.1);margin:10px 10px}
@media (min-width:861px){
  .sb{transition:width .18s ease}
  .main{transition:left .18s ease}
  body.rail .main{left:72px}
  body.rail .sb:not(:hover){width:72px}
  body.rail .sb:hover{box-shadow:16px 0 40px rgba(10,37,64,.35)}
  body.rail .sb:not(:hover) .brand{justify-content:center;padding:20px 0 18px}
  body.rail .sb:not(:hover) .brand>div:last-child,
  body.rail .sb:not(:hover) .nav .tx,
  body.rail .sb:not(:hover) .nav .tag,
  body.rail .sb:not(:hover) .nav .chev,
  body.rail .sb:not(:hover) .nav .sub,
  body.rail .sb:not(:hover) .sbfoot{display:none}
  body.rail .sb:not(:hover) .nav .gh.has-on{background:#fff;color:var(--ind-800)}
  body.rail .sb:not(:hover) .nav .gh.has-on>i:first-child{color:var(--ind-600)}
  body.rail .sb:not(:hover) .grp{font-size:0;height:1px;padding:0;margin:10px 10px;background:rgba(255,255,255,.12)}
  body.rail .sb:not(:hover) .nav{padding:4px 12px 16px;overflow-x:hidden}
  body.rail .sb:not(:hover) .nav button{justify-content:center;padding:10px 0}
  body.rail .sb:not(:hover) .nav button.on::after{display:none}
}
@media (max-width:1320px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:1100px){.g21,.g11,.g111{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .sb{transform:translateX(-100%)}
  body.nav-open .sb{transform:none;box-shadow:12px 0 40px rgba(10,37,64,.35)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,37,64,.4);z-index:55}
  .main{left:0}
  .burger{display:block}
  .crumb,.clock{display:none}
  #home{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .top{padding:0 16px;gap:8px}
  .hero-head{padding:16px 16px 14px}.hero-head h2{font-size:22px}
  .hero .contour{width:360px;right:-120px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}
  .kpi:nth-child(odd){border-left:0!important}.kpi:nth-child(-n+2){border-top:0}
  .kpi .v{font-size:22px}
  .hb{grid-template-columns:minmax(0,90px) minmax(0,1fr) auto}
  .pipe .r{grid-template-columns:22px minmax(0,96px) minmax(0,1fr) 22px}
  .top .btn span{display:none}
  .panel{padding:16px}
}
@media print{
  body{overflow:visible;background:#fff}
  .sb,.top .btn,.burger,.frame,.toast,.tip,.hero .contour{display:none!important}
  .main{position:static}.content{position:static}#home{position:static;overflow:visible;padding:0}
  .panel,.hero,.report{break-inside:avoid}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .report{background:#fff;color:var(--ink);border:1px solid var(--line)}.report .ph h3,.report ol b{color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside class="sb" id="sb">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></div>
    <div><b>JURUKUR MAHABOB</b><span>Operations Hub</span></div>

const $=s=>document.querySelector(s);

/* Untuk nilai dalam data-tip: getAttribute() decode entity sekali, lepas tu tip.innerHTML parse sekali lagi.

const escA=s=>esc(esc(s));

const rm=n=>'RM '+Math.round(n||0).toLocaleString('en-MY');
const rmK=n=>{n=n||0;return Math.abs(n)>=1e6?'RM '+(n/1e6).toFixed(2)+'j':Math.abs(n)>=1e3?'RM '+(n/1e3).toFixed(1)+'k':'RM '+Math.round(n);};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const parseD=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;};
const dmy=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'–';
const daysTo=d=>Math.round((d-today())/864e5);

const stripHTML=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d;};

/* ================= FRAMES ================= */
const frames={};const ready={};
function makeFrame(id){
  const f=document.createElement('iframe');
  f.className='frame';f.id='fr-'+id;f.title=id;
  f.addEventListener('load',()=>{ready[id]=true;onFrameReady(id);});
  f.src=MODULES[id];
  $('#content').appendChild(f);frames[id]=f;
}
function makeApp(k){
  const key='app:'+k,f=document.createElement('iframe');
  f.className='frame';f.name='jm-app-'+k;f.title=APPS[k].t;f.setAttribute('allow','clipboard-write');
  f.addEventListener('load',()=>{ready[key]=true;if(current===key)$('#loading').classList.remove('on');});
  f.src=appUrl(k);$('#content').appendChild(f);frames[key]=f;
}
function win(id){try{const w=frames[id]&&ready[id]?frames[id].contentWindow:null;if(w)void w.document;return w;}catch(e){return null;}}
function onFrameReady(id){
  if(id==='ops')try{
    // keep shell sidebar in sync when ops navigates internally (e.g. clicking a KPI)
    const w=win('ops');
    if(w&&typeof w.go==='function'&&!w.go._jm){
      const orig=w.go;const wrapped=function(p){orig(p);if(current.startsWith('ops:')&&current!=='ops:'+p)setActive('ops:'+p,true);};
      wrapped._jm=true;w.go=wrapped;
      if(pendingOps){orig(pendingOps);pendingOps=null;}
    }
  }catch(e){}
  if(Object.keys(MODULES).every(k=>ready[k]))scheduleRender();
}

/* ================= ROUTER ================= */

const nk=x=>String(x==null?'':x).toUpperCase().replace(/[^A-Z0-9]/g,'');
function csvRows(txt){
  txt=txt.replace(/^\uFEFF/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(ch!=='\r')cur+=ch;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
async function getCSV(url){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch(url+'&_t='+Date.now(),{cache:'no-store',signal:ctl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);const txt=await r.text();
    if(/^\s*</.test(txt))throw new Error('respons bukan CSV');return csvRows(txt);}
  catch(e){throw new Error(e.name==='AbortError'?'tamat masa':e.message);}
  finally{clearTimeout(tm);}
}
/* Inventori: Nama | Peralatan | S/N | Detail | Status | Catatan — Nama & Peralatan hanya di baris pertama setiap kumpulan */
function parseInv(rows){
  const h=(rows[0]||[]).map(nk),ix=n=>h.indexOf(n);
  const iN=ix('NAMA'),iP=ix('PERALATAN'),iS=ix('SN'),iD=ix('DETAIL'),iSt=ix('STATUS'),iC=ix('CATATAN');
  if(iP<0||iSt<0)throw new Error('lajur Peralatan/Status tiada');
  const teams=[],by={};let nama='',item=null;
  rows.slice(1).forEach(r=>{
    const g=i=>i<0?'':String(r[i]==null?'':r[i]).trim();
    if(!r.join('').trim())return;
    if(g(iN))nama=g(iN);
    if(g(iP)){let tm=by[nama];if(!tm){tm=by[nama]={name:nama||'–',groups:[{cat:'',items:[]}]};teams.push(tm);}
      item={name:g(iP),serial:g(iS),comp:[]};tm.groups[0].items.push(item);}
    if(item&&(g(iD)||g(iSt)))item.comp.push({d:g(iD)||'Keadaan umum',s:/tidak|rosak/i.test(g(iSt))?'tidak':'baik',c:g(iC)});
  });
  return {teams:teams};
}
/* QC: logik status sama seperti aplikasi Kualiti Pelan */
function parseQC(rows,cat){
  const h=(rows[0]||[]).map(nk);
  const get=(r,names)=>{for(const n of names){const i=h.indexOf(nk(n));if(i>=0&&r[i]!=null&&String(r[i]).trim())return String(r[i]).trim();}return '';};
  return rows.slice(1).filter(r=>r.join('').trim()).map(r=>{
    const sl=get(r,['STATUS','STATUS QC','KEPUTUSAN','STATE']).toLowerCase();
    const st=/rework|tolak|baiki|reject|gagal|tidak lulus|tak lulus/.test(sl)?'REWORK REQUIRED':/lul|siap|pass|selesai|approved/.test(sl)?'LULUS':'DALAM PROSES QC';
    return {MAKLUMAT:(get(r,['MAKLUMAT','BIDANG','KATEGORI'])||cat).toUpperCase(),'NO. FAIL':get(r,['NO. FAIL','NO_FAIL','FILE NO','NO REF'])||'–',
      PERKARA:get(r,['PERKARA','PROJEK','TAJUK','DESCRIPTION','PROJECT']),'NAMA SURVEYOR':get(r,['NAMA SURVEYOR','SURVEYOR','PEGAWAI']),STATUS:st};
  });
}
/* Web App: POST text/plain (tiada preflight), Apps Script redirect ke googleusercontent yang beri CORS * */
async function gasCall(url,fn,args){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
  try{const r=await fetch(url,{method:'POST',redirect:'follow',cache:'no-store',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let j;try{j=await r.json();}catch(e){throw new Error('respons bukan JSON');}
    if(!j||j.ok!==true)throw new Error((j&&j.error)||'ralat Web App');return j.result;}
  catch(e){throw new Error(e.name==='AbortError'?'tamat masa':e.message);}
  finally{clearTimeout(tm);}
}
function parseCK(res){
  if(!res||res.success===false)throw new Error((res&&res.message)||'data tidak sah');
  const proj={};(res.projects||[]).forEach(p=>{proj[p.project_id]=p.file_ref||p.project_title||p.project_id;});
  const sheets=(res.drawingSheets||[]).map(s=>({
    id:s.sheet_id,no:s.sheet_number||s.drawing_no||s.sheet_id||'–',type:String(s.drawing_type||'').trim().toUpperCase(),
    st:String(s.current_status||'DRAFT').trim().toUpperCase(),round:Number(s.current_round)||1,
    drafter:s.drafter_name||'',checker:s.assigned_checker_name||'',proj:proj[s.project_id]||s.file_ref||s.project_id||''

}

/* ================= CHARTS ================= */
function niceStep(m){const p=Math.pow(10,Math.floor(Math.log10(m||1)));const n=m/p;return (n<=2?0.5:n<=5?1:2)*p;}
function groupBars(data,series){
  const W=620,H=240,pl=48,pr=8,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  let max=0;data.forEach(d=>series.forEach(s=>{max=Math.max(max,+d[s.k]||0);}));
  const step=niceStep(max||1),top=Math.ceil((max||1)/step)*step;
  let g='';for(let y=0;y<=top+1e-9;y+=step){const yy=pt+ih-(y/top)*ih;g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#eef0f6"/><text x="${pl-8}" y="${yy+3.5}" font-size="10.5" fill="#757a94" text-anchor="end">${y}k</text>`;}
  const n=data.length,bw=iw/n,inner=Math.min(bw*0.62,58),gw=inner/series.length;
  let b='';data.forEach((d,i)=>{const x0=pl+i*bw+(bw-inner)/2;
    series.forEach((s,j)=>{const v=+d[s.k]||0,h=Math.max(0,(v/top)*ih),x=x0+j*gw,y=pt+ih-h,w=gw-2,r=Math.min(4,h,w/2);
      const path=h>0?`M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${pt+ih}Z`:'';
      b+=`<path d="${path}" fill="${s.c}"/><rect x="${x-1}" y="${pt}" width="${w+2}" height="${ih}" fill="transparent" data-tip="<b>${escA(d.m)}</b> · ${escA(s.l)}<br>RM ${(v*1000).toLocaleString('en-MY')}"/>`;});
    b+=`<text x="${pl+i*bw+bw/2}" y="${H-9}" font-size="11.5" fill="#484d66" text-anchor="middle">${esc(d.m)}</text>`;});
  // emphasise last period values
  const last=data[n-1];if(last){series.forEach((s,j)=>{const v=+last[s.k]||0,x=pl+(n-1)*bw+(bw-inner)/2+j*gw+(gw-2)/2,y=pt+ih-(v/top)*ih-5;b+=`<text x="${x}" y="${y}" font-size="10.5" font-weight="700" fill="#16182b" text-anchor="middle">${v}k</text>`;});}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta hasil vs belanja">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="#c8cbe0"/>${b}</svg>`;
}
function hbStack(label,parts,total,valTxt){
  const sum=parts.reduce((a,p)=>a+p.v,0)||1;
  return `<div class="hb"><div class="n" title="${esc(label)}">${esc(label)}</div><div class="track">${parts.filter(p=>p.v>0).map(p=>`<span style="width:${p.v/sum*100*(total?sum/total:1)}%;background:${p.c}" data-tip="<b>${escA(label)}</b><br>${escA(p.l)}: ${escA(p.t||p.v)}"></span>`).join('')}</div><div class="val">${valTxt}</div></div>`;
}

  R.push(`<b>Kewangan:</b> ${rm(billed)} telah diinvois, ${rm(paid)} diterima (${billed?Math.round(paid/billed*100):0}%). Baki belum dikutip ${rm(outst)}${clients.length?`, terbesar dari ${esc(clients.slice().sort((a,b)=>b[1].o-a[1].o)[0][0])}`:''}. Perbelanjaan direkod ${rm(expT)}.`);
  R.push(`<b>Pelan:</b> ${DRW?`${DL.length} lukisan dalam Status Pelan — ${drSt['Diluluskan']} diluluskan, ${drSt['Dalam Semakan']} dalam semakan, ${drSt['Penyediaan Plan']} dalam penyediaan, ${drSt['Belum Mula']} belum mula${drOver.length?`, ${drOver.length} melepasi sasaran`:''}.`:'tiada data Status Pelan dalam browser ini.'}${EXT.ck?` Checklist: ${CKS.length} helaian — ${ckN.APPROVED} lulus, ${ckN.PENDING_CHECK} menunggu semakan, ${ckN.RETURNED} dipulangkan, ${ckN.DRAFT} draf${ckMulti.length?`, ${ckMulti.length} dah 3 round ke atas`:''}.`:''}${QX.length?` QC: ${QX.length} fail — ${qxPass} lulus, ${qxProg} dalam proses, ${qxRw.length} perlu rework.`:''}`);
  R.push(`<b>Sumber manusia:</b> ${ST.length} kakitangan, purata kehadiran ${avgAtt}%, ${pendLeave.length} permohonan cuti menunggu kelulusan.`);
  if(EXT.inv)R.push(`<b>Peralatan:</b> ${invTot} item dipegang ${invTeams.length} orang — ${invOk} baik, ${invWarn} perlu perhatian, ${invBad} tidak baik${badItems.length?` (${badItems.slice(0,3).map(x=>esc(x.it.name)+' / '+esc(x.team)).join(', ')}${badItems.length>3?', …':''})`:''}.`);
  R.push(`<b>Fail tracking:</b> ${trk.length?`${trk.length} fail, ${trkActive.length} aktif, ${trkClosed.length} ditutup, purata kemajuan ${trkAvg}%${trkOver.length?`, ${trkOver.length} melepasi tarikh tamat`:''}.`:'belum ada fail direkod.'}`);
  if(q)R.push(`<b>Sebut harga semasa:</b> ${esc(q.ref)} untuk ${esc(q.client)} bernilai RM ${q.total.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})} (termasuk SST ${q.taxRate}%).`);
  if(pl)R.push(`<b>Ramalan kerja:</b> ${pl.td.toFixed(1)} team-days${pl.days!=null?`, anggaran ${pl.days} hari kerja dengan ${pl.teams} team`:''}; kos ${rm(pl.cost)}, sebut harga ${rm(pl.quote)}, margin ${pl.margin.toFixed(1)}%.`);
  LAST_REPORT='LAPORAN RINGKAS OPERASI — JURUKUR MAHABOB & CO. SDN. BHD.\nTarikh: '+dmy(new Date())+'\n\n'+R.map((r,i)=>(i+1)+'. '+stripHTML(r).textContent).join('\n');
  h+=`<div class="report"><div class="ph"><h3>Laporan ringkas</h3><span class="src">Dijana automatik · ${dmy(new Date())}</span><div class="sp"></div><button class="btn" id="btnCopy"><i class="fa-solid fa-copy"></i>Salin teks</button></div><ol>${R.map(r=>`<li>${r}</li>`).join('')}</ol></div>`;

  $('#home').innerHTML=h;
  const cp=$('#btnCopy');if(cp)cp.onclick=copyReport;
}
function copyReport(){
  const done=()=>toast('Laporan disalin');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(LAST_REPORT).then(done,fallback);}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=LAST_REPORT;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Tak dapat salin — pilih teks secara manual');}ta.remove();}
}
$('#home').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go);});

/* ================= TOOLTIP ================= */
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tip.classList.remove('on');return;}
  tip.innerHTML=t.getAttribute('data-tip');tip.classList.add('on');
  const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;
  tip.style.left=x+'px';tip.style.top=y+'px';});

/* ================= BACKUP / RESTORE ================= */
$('#bkExport').onclick=()=>{
  // flush in-memory state of modules that only save on demand
  try{const w=win('quotation');if(w&&w.saveLocal)w.saveLocal();}catch(e){}
  const out={app:'JMC Operations Hub',version:1,exported:new Date().toISOString(),data:{}};
  [...Object.values(KEYS),...EXTRA_KEYS].forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)out.data[k]=v;}catch(e){}});
  try{const o=readOps();if(o&&!out.data[KEYS.ops])out.data[KEYS.ops]=JSON.stringify(o);}catch(e){}
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();a.download='JMC_Backup_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Backup dimuat turun');
};
let pendingRestore=null;
$('#bkImport').onclick=()=>$('#bkFile').click();
$('#bkFile').onchange=function(){const f=this.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=e=>{try{const j=JSON.parse(e.target.result);if(!j||!j.data||typeof j.data!=='object')throw 0;
    const allowed=[...Object.values(KEYS),...EXTRA_KEYS];const keys=Object.keys(j.data).filter(k=>allowed.includes(k));
    if(!keys.length)throw 0;pendingRestore={data:j.data,keys:keys};
    $('#modalTxt').textContent='Fail backup bertarikh '+(j.exported?dmy(new Date(j.exported)):'tidak diketahui')+' mengandungi '+keys.length+' set data. Data semasa akan diganti dan app dimuat semula.';
    $('#modal').classList.add('on');}catch(err){toast('Fail backup tidak sah');}this.value='';};rd.readAsText(f);};
$('#mNo').onclick=()=>{pendingRestore=null;$('#modal').classList.remove('on');};
$('#mYes').onclick=()=>{if(!pendingRestore)return;try{pendingRestore.keys.forEach(k=>{const v=pendingRestore.data[k];localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));});location.reload();}catch(e){toast('Gagal pulihkan: '+e.message);}};

/* ================= TOP BAR ================= */
$('#btnRefresh').onclick=()=>{render();loadExt();toast('Data dikemas kini');};
$('#btnOpen').onclick=()=>{const [m,k]=current.split(':');if(m==='app'&&APPS[k])window.open(appUrl(k),'_blank','noopener');};
$('#btnPrint').onclick=()=>window.print();
function tick(){const d=new Date();$('#clock').textContent=dmy(d)+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(tick,30000);
// other same-origin documents (the module iframes) fire storage events here when they save
window.addEventListener('storage',scheduleRender);

/* ================= BOOT ================= */
Object.keys(MODULES).forEach(makeFrame);
makeApp('site-status'); // pre-load: Status Site hantar ringkasan progres ke Dashboard Utama, dan sedia bila menu diklik
loadExt();setInterval(loadExt,5*60*1000);
render();
const h0=location.hash.slice(1).replace('-',':');
const valid=[...document.querySelectorAll('#nav button[data-v]')].map(b=>b.dataset.v);
show(valid.includes(h0)?h0:'home');
})();
</script>
</body>
</html>
